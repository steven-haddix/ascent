[package]
name = "ascent"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ascent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.0", features = ["bundled"] }
sqlite-vec = "0.1.9"
reqwest = { version = "0.13.4", features = ["stream", "json"] }
futures-util = "0.3.32"
# tokio 1.52.3 requires tokio-macros ~2.7.0 (not yet on crates.io); pin below it.
tokio = { version = ">=1.40, <1.52", features = ["rt-multi-thread", "macros"] }
keyring = { version = "^3", features = ["apple-native"] }
base64 = "0.22.1"

